<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data viewer</title>
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(lib/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(lib/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-weight:500;src:url(lib/fonts/source-serif-4-latin-500-normal.woff2) format('woff2')}
body{margin:0;background:#faf9f5;color:#141413;font:14px/1.5 'Inter',system-ui,sans-serif;padding:32px 20px}
.w{max-width:1000px;margin:0 auto}h1{font:500 26px 'Source Serif 4',Georgia,serif;margin:0 0 4px}
.m{color:#6b6a64;margin:0 0 16px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button,label.b{font:inherit;border:1px solid #e8e6dc;background:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500}
button:hover,label.b:hover{background:#f3f1e8}
.card{background:#fff;border:1px solid #e8e6dc;border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 14px;border-bottom:1px solid #e8e6dc;white-space:nowrap}
th{color:#6b6a64;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#faf9f5}
tr:last-child td{border-bottom:0}pre{margin:0;padding:14px;font-size:12px;white-space:pre-wrap}.err{color:#c0392b}
</style></head><body><div class="w">
<h1>Data viewer</h1><p class="m" id="src">Loading…</p>
<div class="bar"><button id="re">Reload</button><label class="b">Open data.json…<input type="file" id="f" accept=".json" hidden></label><button id="raw">Show raw JSON</button></div>
<div class="card"><div id="out"></div></div></div>
<script>
const $=id=>document.getElementById(id);let items=[],showRaw=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(src){
  $('src').textContent=src+' — '+items.length+' record'+(items.length===1?'':'s');
  if(showRaw){$('out').innerHTML='<pre>'+esc(JSON.stringify(items,null,2))+'</pre>';return}
  const cols=['id','type','name','cat','start','end','tent'];
  $('out').innerHTML='<table><tr><th>#</th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+
    items.map((x,i)=>'<tr><td>'+(i+1)+'</td>'+cols.map(c=>'<td>'+esc(x[c])+'</td>').join('')+'</tr>').join('')+'</table>'}
async function load(){
  try{const r=await fetch('api/data',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
    items=j.items||[];draw('data.json (live from server)');
    if(!load.p){load.p=1;setInterval(()=>fetch('api/ping').catch(()=>{}),5000)}}
  catch(e){$('src').innerHTML='<span class="err">Server not reachable.</span> Click “Open data.json…” and choose the file.';$('out').innerHTML=''}}
$('re').onclick=load;$('raw').onclick=()=>{showRaw=!showRaw;$('raw').textContent=showRaw?'Show table':'Show raw JSON';draw($('src').textContent.split(' — ')[0])};
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());items=Array.isArray(j)?j:(j.items||[]);draw(f.name)}catch(x){$('src').innerHTML='<span class="err">Not valid JSON.</span>'}};
load();
</script></body></html>
